# Sobe Plin a TestFlight cun Mac de GitHub (Apple só deixa compilar e subir
# dende macOS). Lánzase ao publicar unha release con un destes adxuntos:
#   - PlinIOS.tar.gz.enc: o proxecto de Xcode exportado por Unity en Windows,
#     cifrado (por se o repositorio se fai público). Aquí descífrase,
#     compílase, asínase e sóbese. (Un PlinIOS.tar.gz sen cifrar tamén vale.)
#   - un .ipa xa feito (por exemplo, o de Unity DevOps): só se sobe.
#
# Por defecto a build sobe SEN avisar aos testers (apágase "Notificar aos
# testers automaticamente" en App Store Connect). Para avisalos: pon #notificar
# nas notas da release, ou marca "notificar" ao lanzalo a man.
#
# Segredos do repositorio:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8   a clave da API de App Store Connect
#   P12_BASE64, P12_CLAVE                   o certificado de distribución e a súa contrasinal
#   PERFIL_BASE64                           o perfil App Store (.mobileprovision)
#   PAQUETE_CLAVE                           o contrasinal do paquete cifrado (o de paquete.clave)
name: Subir a TestFlight

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      etiqueta:
        description: "Etiqueta da release"
        required: true
      notificar:
        description: "Avisar aos testers"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  subir:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      NOTIFICAR: ${{ inputs.notificar == true || contains(github.event.release.body, '#notificar') }}
    steps:
      # Apple pide o SDK de iOS 27 (Xcode 27) dende abril de 2027. O Mac de
      # GitHub pode ter varios Xcode e non sempre usa o máis novo: escóllese o
      # Xcode 27 (ou posterior) máis alto que haxa; se non hai, segue co de
      # sempre e avisa.
      - name: Escoller o Xcode máis novo
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null \
            | grep -E 'Xcode_(2[7-9]|[3-9][0-9])' | grep -viE 'beta|rc' | sort -V | tail -n 1 || true)
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "$XCODE/Contents/Developer"
          else
            echo "::warning::Non hai Xcode 27 neste Mac: compílase co de sempre (dende abril de 2027 Apple non o aceptará)."
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Baixar o adxunto da release
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETA: ${{ github.event.release.tag_name || inputs.etiqueta }}
          PAQUETE_CLAVE: ${{ secrets.PAQUETE_CLAVE }}
        run: |
          gh release download "$ETIQUETA" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/entrada"
          ls -la "$RUNNER_TEMP/entrada"
          IPA=$(ls "$RUNNER_TEMP"/entrada/*.ipa 2>/dev/null | head -n 1 || true)
          if [ -n "$IPA" ]; then
            echo "IPA=$IPA" >> "$GITHUB_ENV"
            echo "Hai un .ipa: só se sobe."
          else
            ENC=$(ls "$RUNNER_TEMP"/entrada/*.tar.gz.enc 2>/dev/null | head -n 1 || true)
            if [ -n "$ENC" ]; then
              # O openssl 3 de Homebrew (o do sistema é LibreSSL); os mesmos
              # parámetros ca ao cifrar en Windows.
              OPENSSL=$(brew --prefix openssl@3 2>/dev/null)/bin/openssl
              [ -x "$OPENSSL" ] || OPENSSL=openssl
              "$OPENSSL" enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256                 -in "$ENC" -out "$RUNNER_TEMP/PlinIOS.tar.gz" -pass env:PAQUETE_CLAVE
              rm -f "$ENC"
              TGZ="$RUNNER_TEMP/PlinIOS.tar.gz"
            else
              TGZ=$(ls "$RUNNER_TEMP"/entrada/*.tar.gz | head -n 1)
            fi
            mkdir -p "$RUNNER_TEMP/proxecto"
            tar -xzf "$TGZ" -C "$RUNNER_TEMP/proxecto"
            PROXECTO=$(dirname "$(find "$RUNNER_TEMP/proxecto" -maxdepth 3 -name Unity-iPhone.xcodeproj | head -n 1)")
            echo "PROXECTO=$PROXECTO" >> "$GITHUB_ENV"
            echo "Proxecto de Xcode en $PROXECTO: compílase."
          fi

      - name: Certificado e perfil
        if: env.PROXECTO != ''
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_CLAVE: ${{ secrets.P12_CLAVE }}
          PERFIL_BASE64: ${{ secrets.PERFIL_BASE64 }}
        run: |
          # Un chaveiro propio, só para esta execución.
          KC="$RUNNER_TEMP/plin.keychain-db"
          KCP=$(uuidgen)
          security create-keychain -p "$KCP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCP" "$KC"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/plin.p12"
          security import "$RUNNER_TEMP/plin.p12" -P "$P12_CLAVE" -A -t cert -f pkcs12 -k "$KC"
          rm -f "$RUNNER_TEMP/plin.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCP" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

          IDENTIDADE=$(security find-identity -v -p codesigning "$KC" | grep -o '"[^"]*"' | head -n 1 | tr -d '"')
          [ -n "$IDENTIDADE" ] || { echo "O .p12 non trae ningún certificado para asinar."; exit 1; }
          echo "Certificado: $IDENTIDADE"

          # O perfil, onde o busca Xcode.
          printf '%s' "$PERFIL_BASE64" | base64 --decode > "$RUNNER_TEMP/perfil.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/perfil.mobileprovision" > "$RUNNER_TEMP/perfil.plist"
          PERFIL_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/perfil.plist")
          PERFIL_NOME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/perfil.plist")
          EQUIPO=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$RUNNER_TEMP/perfil.plist")
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"
            cp "$RUNNER_TEMP/perfil.mobileprovision" "$d/$PERFIL_UUID.mobileprovision"
          done
          echo "Perfil: $PERFIL_NOME ($PERFIL_UUID), equipo $EQUIPO"

          {
            echo "KC=$KC"
            echo "IDENTIDADE=$IDENTIDADE"
            echo "PERFIL_UUID=$PERFIL_UUID"
            echo "PERFIL_NOME=$PERFIL_NOME"
            echo "EQUIPO=$EQUIPO"
          } >> "$GITHUB_ENV"

      - name: Preparar o proxecto
        if: env.PROXECTO != ''
        working-directory: ${{ env.PROXECTO }}
        run: |
          # Número de build sempre maior ca o anterior, sen ter que tocalo en Unity.
          BUILD="1.$(date -u +%y%m%d).$(date -u +%H%M)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" Info.plist
          echo "Build: $BUILD"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"

          # Firma manual só na app; o framework de Unity asínase ao meterse nela.
          cat > "$RUNNER_TEMP/firma.rb" <<'RUBY'
          require 'xcodeproj'
          p = Xcodeproj::Project.open('Unity-iPhone.xcodeproj')
          p.targets.each do |t|
            t.build_configurations.each do |c|
              s = c.build_settings
              s['DEVELOPMENT_TEAM'] = ENV['EQUIPO']
              s['CODE_SIGN_STYLE'] = 'Manual'
              s['CODE_SIGN_IDENTITY'] = ENV['IDENTIDADE']
              s['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = ENV['IDENTIDADE']
              if t.name == 'Unity-iPhone'
                s['PROVISIONING_PROFILE_SPECIFIER'] = ENV['PERFIL_NOME']
                s['PROVISIONING_PROFILE'] = ENV['PERFIL_UUID']
                s['PROVISIONING_PROFILE_APP'] = ENV['PERFIL_UUID']
              else
                s['PROVISIONING_PROFILE_SPECIFIER'] = ''
                s['PROVISIONING_PROFILE'] = ''
              end
            end
          end
          p.save
          RUBY
          ruby "$RUNNER_TEMP/firma.rb"

          pod install

      - name: Compilar
        if: env.PROXECTO != ''
        working-directory: ${{ env.PROXECTO }}
        run: |
          xcodebuild -workspace Unity-iPhone.xcworkspace -scheme Unity-iPhone \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Plin.xcarchive" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KC" \
            -quiet archive

          cat > "$RUNNER_TEMP/exportar.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$EQUIPO</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>$IDENTIDADE</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.nucestudio.plin</key><string>$PERFIL_NOME</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Plin.xcarchive" \
            -exportPath "$RUNNER_TEMP/saida" -exportOptionsPlist "$RUNNER_TEMP/exportar.plist"
          echo "IPA=$(ls "$RUNNER_TEMP"/saida/*.ipa | head -n 1)" >> "$GITHUB_ENV"

      - name: Subir con altool
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          CLAVE=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          printf '%s\n' "$ASC_KEY_P8" > "$CLAVE"
          trap 'rm -f "$CLAVE"' EXIT
          echo "Subindo $IPA"
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Sen avisar aos testers
        if: env.NOTIFICAR != 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUNDLE_ID: com.nucestudio.plin
        run: |
          # Co .ipa xa feito, o número de build vén dentro del.
          if [ -z "$BUILD" ]; then
            unzip -o -q "$IPA" 'Payload/*.app/Info.plist' -d "$RUNNER_TEMP/ipa"
            BUILD=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$RUNNER_TEMP"/ipa/Payload/*.app/Info.plist)
            export BUILD
          fi
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "pyjwt[crypto]"
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          # Agarda a que App Store Connect vexa a build (aínda procesándose) e
          # apágalle o aviso automático aos testers. Ten que ser antes de que
          # remate de procesarse: é cando se avisa.
          import json, os, time, urllib.parse, urllib.request
          import jwt

          API = "https://api.appstoreconnect.apple.com/v1"

          def token():
              agora = int(time.time())
              return jwt.encode(
                  {"iss": os.environ["ASC_ISSUER_ID"], "iat": agora, "exp": agora + 1200, "aud": "appstoreconnect-v1"},
                  os.environ["ASC_KEY_P8"], algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})

          def pedir(metodo, ruta, corpo=None):
              datos = json.dumps(corpo).encode() if corpo is not None else None
              req = urllib.request.Request(API + ruta, data=datos, method=metodo,
                  headers={"Authorization": "Bearer " + token(), "Content-Type": "application/json"})
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          build = os.environ["BUILD"]
          app = pedir("GET", "/apps?" + urllib.parse.urlencode({"filter[bundleId]": os.environ["BUNDLE_ID"]}))["data"][0]["id"]
          print(f"Agardando á build {build}...")
          detalle = None
          for _ in range(80):  # ata 40 minutos
              r = pedir("GET", "/builds?" + urllib.parse.urlencode(
                  {"filter[app]": app, "filter[version]": build, "include": "buildBetaDetail"}))
              if r["data"]:
                  detalle = r["data"][0]["relationships"]["buildBetaDetail"]["data"]["id"]
                  break
              time.sleep(30)
          if detalle is None:
              raise SystemExit(f"A build {build} non apareceu en App Store Connect: non se puido quitar o aviso.")

          pedir("PATCH", f"/buildBetaDetails/{detalle}",
              {"data": {"type": "buildBetaDetails", "id": detalle, "attributes": {"autoNotifyEnabled": False}}})
          print(f"Build {build}: sobe sen avisar aos testers.")
          PY

      - name: Borrar o chaveiro
        if: always() && env.KC != ''
        run: security delete-keychain "$KC" || true
